name: Build Mustawda APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/project

          FOUND=""

          while IFS= read -r -d '' ZIP; do
            echo "Checking: $ZIP"

            rm -rf /tmp/project/*
            unzip -oq "$ZIP" -d /tmp/project || continue

            PACKAGE=$(find /tmp/project \
              -type f -name package.json \
              ! -path "*/node_modules/*" | head -n 1 || true)

            if [ -n "$PACKAGE" ]; then
              DIR="$(dirname "$PACKAGE")"

              if [ -f "$DIR/capacitor.config.json" ] &&
                 [ -f "$DIR/www/index.html" ]; then
                FOUND="$DIR"
                echo "Valid project found."
                break
              fi
            fi
          done < <(find . -maxdepth 5 -type f -iname '*.zip' -print0)

          if [ -z "$FOUND" ]; then
            echo "No valid project ZIP found."
            exit 1
          fi

          cp -a "$FOUND"/. "$GITHUB_WORKSPACE"/

          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html

      - name: Install dependencies
        run: npm install

      - name: Prepare Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mustawda-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
